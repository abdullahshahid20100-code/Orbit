<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1f2438"/>
      <stop offset="100%" stop-color="#0f111a"/>
    </radialGradient>

    <!-- Ring Core Gradient -->
    <linearGradient id="ringCore" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#c4b5fd"/>
      <stop offset="60%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Secondary Orbit Ring Gradient -->
    <linearGradient id="orbitGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Outer Soft Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="10" y="10" width="180" height="180" rx="44" fill="url(#bgGlow)" stroke="#2d334d" stroke-width="2"/>
  
  <!-- Subtle inner radial shadow -->
  <rect x="10" y="10" width="180" height="180" rx="44" fill="none" stroke="rgba(167, 139, 250, 0.15)" stroke-width="1"/>

  <!-- Orbiting Geometry with Neon Glow -->
  <g filter="url(#neonGlow)" transform="translate(100, 100) rotate(-28)">
    <!-- Back part of outer orbit ellipse -->
    <ellipse cx="0" cy="0" rx="72" ry="24" fill="none" stroke="url(#orbitGlow)" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

    <!-- Main Central Torus / O-body -->
    <path d="M 0 -52 C 32 -52 44 -26 44 0 C 44 26 32 52 0 52 C -32 52 -44 26 -44 0 C -44 -26 -32 -52 0 -52 Z" 
          fill="none" 
          stroke="url(#ringCore)" 
          stroke-width="18" 
          stroke-linecap="round"/>

    <!-- Inner Core Cutout Rim -->
    <ellipse cx="0" cy="0" rx="20" ry="34" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>

    <!-- Front Crossing Orbit Ring with crisp neon edge -->
    <path d="M -70 4 C -60 22 -20 28 0 28 C 30 28 65 18 72 -4" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="7" 
          stroke-linecap="round"/>
    <path d="M -70 4 C -60 22 -20 28 0 28 C 30 28 65 18 72 -4" 
          fill="none" 
          stroke="url(#orbitGlow)" 
          stroke-width="9" 
          stroke-linecap="round"/>
  </g>
</svg>
